<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>安安小工具系列 | 混合文本编辑器</title>
<!-- ★ 关键修复：KaTeX 样式表（根号/分数/上下标/括号全靠它，缺则公式散架） -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<style>
/* ============================================================
   安安小工具系列 · 统一设计语言（严格遵守）
============================================================ */
:root{
  --bg:#f0f4f8; --card:#fff; --ink:#333; --title:#1a2b4a; --muted:#666; --muted2:#9aa4b2;
  --line:#d0d7de; --line2:#e8edf2; --line3:#eef1f5;
  --blue:#007bff; --blue-d:#0069d9; --blue-bg:#f0f7ff; --blue-bg2:#eaf3ff;
  --dash:#c8d6e5; --th:#f8f9fa; --rowh:#fafbfc;
  --code-bg:#f6f8fa; --code-ink:#2b3445; --gutter-ink:#aab4c2; --gutter-bg:#f8f9fa;
  --red:#cc0000;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,"Courier New",monospace;
  --r:12px; --shadow:0 2px 8px rgba(0,0,0,.06); --shadow-h:0 8px 24px rgba(0,123,255,.12);
}
/* 暗色模式（柔和护眼） */
html.dark{
  --bg:#1e1e1e; --card:#2d2d2d; --ink:#d4d4d4; --title:#e8e8e8; --muted:#999; --muted2:#666;
  --line:#404040; --line2:#353535; --line3:#303030;
  --blue:#4fc3f7; --blue-d:#29b6f6; --blue-bg:#1a2f3a; --blue-bg2:#152530;
  --dash:#404040; --th:#262626; --rowh:#2a2a2a;
  --code-bg:#1e1e1e; --code-ink:#cccccc; --gutter-ink:#555; --gutter-bg:#252525;
  --red:#ef5350;
  --shadow:0 2px 8px rgba(0,0,0,.4); --shadow-h:0 8px 24px rgba(79,195,247,.15);
}
html.dark #source{background:#1e1e1e;color:#d4d4d4}
html.dark .preview{background:#2d2d2d;color:#d4d4d4}
html.dark .btn{background:#353535;border-color:#404040;color:#d4d4d4}
html.dark .btn:hover{border-color:var(--blue);color:var(--blue)}
html.dark .btn.primary{background:var(--blue);border-color:var(--blue);color:#1e1e1e}
html.dark .chip{background:#353535;border-color:#404040;color:#d4d4d4}
html.dark .chip:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-bg)}
html.dark .ichip{color:#999}
html.dark .ichip:hover{color:var(--blue);background:var(--blue-bg)}
html.dark .pop{background:#2d2d2d;border-color:#404040}
html.dark .sbtn{background:#353535;border-color:#404040;color:#d4d4d4}
html.dark .sbtn:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-bg)}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:var(--sans); color:var(--ink); background:var(--bg);
  -webkit-font-smoothing:antialiased; line-height:1.6; padding:26px 16px 48px;
}
.wrap{max-width:1000px;margin:0 auto}

.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:0 2px 16px}
.page-head .t h1{margin:0;font-size:22px;color:var(--title);font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.page-head .t h1 .emo{font-size:22px;line-height:1}
.page-head .t p{margin:5px 0 0;font-size:13px;color:var(--muted)}
.page-head .t p .pill{display:inline-flex;align-items:center;gap:6px;margin-left:8px;font-size:12px;color:var(--blue);background:var(--blue-bg);border:1px solid #cfe4ff;padding:1px 8px;border-radius:999px;vertical-align:middle}
.page-head .t p .pill .dot{width:7px;height:7px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 0 rgba(0,123,255,.5);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(0,123,255,.45)}70%{box-shadow:0 0 0 6px rgba(0,123,255,0)}100%{box-shadow:0 0 0 0 rgba(0,123,255,0)}}
.head-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line2);margin-bottom:16px;transition:box-shadow .2s ease,border-color .2s ease}

.btn{font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;color:var(--ink);
  background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 12px;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  transition:transform .12s ease,border-color .15s,color .15s,background .15s,box-shadow .15s}
.btn:hover{border-color:var(--blue);color:var(--blue);transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,123,255,.10)}
.btn:active{transform:translateY(0) scale(.97)}
.btn .ic{font-size:14px;line-height:1}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-d);border-color:var(--blue-d);color:#fff;box-shadow:0 6px 16px rgba(0,123,255,.28)}
.btn.on{background:var(--blue-bg);border-color:var(--blue);color:var(--blue)}

.toolbar{padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.trow{display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding:4px 0;border-bottom:1px solid var(--line3)}
.trow:last-child{border-bottom:0;padding-bottom:0}
.trow .lab{font-size:11px;color:#fff;background:var(--blue);padding:2px 8px;border-radius:5px;margin-right:6px;user-select:none;white-space:nowrap;font-weight:600;letter-spacing:.03em}
.trow .lab.chinese{background:#e67e22}
.trow .lab.math{background:#9b59b6}
.trow .lab.english{background:#27ae60}
.trow .lab.chem{background:#e74c3c}
.trow .lab.format{background:#7f8c8d}
.tsep{width:1px;height:18px;background:var(--line2);margin:0 4px;flex:none}
.ichip{font-family:var(--sans);font-size:15px;cursor:pointer;color:var(--muted);
  background:none;border:none;padding:4px 7px;line-height:1;white-space:nowrap;border-radius:4px;
  transition:color .12s,background .12s}
.ichip:hover{color:var(--blue);background:var(--blue-bg)}
.ichip:active{transform:scale(.9)}
.chip{font-family:var(--sans);font-size:13px;cursor:pointer;color:var(--ink);
  background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 10px;white-space:nowrap;
  transition:transform .12s ease,border-color .15s,color .15s,background .15s,box-shadow .15s}
.chip:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-bg);transform:translateY(-1px);box-shadow:0 3px 10px rgba(0,123,255,.10)}
.chip:active{transform:scale(.95)}

.editor-card{overflow:hidden}
.editor-card:focus-within{border-color:var(--blue);box-shadow:var(--shadow-h)}
.cols{display:flex;min-height:0}
.col{display:flex;flex-direction:column;min-width:0}
.col.src{flex:1 1 50%}
.col.prev{flex:1 1 50%;border-left:1px solid var(--line2)}
.phead{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;font-size:12px;color:var(--muted);
  background:var(--th);border-bottom:1px solid var(--line3);letter-spacing:.02em}
.phead .meta{font-variant-numeric:tabular-nums;color:var(--muted2)}

.editor-wrap{position:relative;flex:1;display:flex;min-height:0;background:#fff}
.gutter{flex:none;width:42px;overflow:hidden;text-align:right;padding:14px 8px 14px 0;
  font-family:var(--mono);font-size:13px;line-height:1.6;color:var(--gutter-ink);user-select:none;
  background:var(--gutter-bg);border-right:1px solid var(--line3);font-variant-numeric:tabular-nums}
.gutter div{height:calc(13px*1.6)}
#source{flex:1;min-width:0;resize:none;border:0;outline:0;background:#fafbfc;color:var(--code-ink);
  font-family:var(--mono);font-size:13px;line-height:1.6;padding:14px 16px;caret-color:var(--blue);tab-size:2;white-space:pre;overflow:auto}

#source::selection{background:var(--blue-bg2)}
#source::-webkit-scrollbar,.preview::-webkit-scrollbar{width:9px;height:9px}
#source::-webkit-scrollbar-thumb{background:#d3dbe6;border-radius:5px}
.preview::-webkit-scrollbar-thumb{background:#d3dbe6;border-radius:5px}
.drop-hint{position:absolute;inset:8px;border:2px dashed var(--dash);border-radius:10px;background:rgba(240,247,255,.6);
  display:none;align-items:center;justify-content:center;pointer-events:none;z-index:5}
.editor-wrap.dragover .drop-hint{display:flex;border-color:var(--blue);background:var(--blue-bg)}
.drop-hint span{font-size:14px;color:var(--blue);font-weight:600;background:#fff;border:1px solid #cfe4ff;border-radius:8px;padding:8px 16px;box-shadow:var(--shadow)}

.splitter{flex:none;width:9px;cursor:col-resize;display:flex;align-items:center;justify-content:center;background:var(--th);position:relative}
.splitter::before{content:"";width:3px;height:30px;border-radius:3px;background:#cfd8e3;transition:background .15s,height .15s}
.splitter:hover::before,.splitter.drag::before{background:var(--blue);height:48px}

.statusbar{display:flex;align-items:center;gap:18px;padding:8px 14px;font-size:12px;color:var(--muted);
  border-top:1px solid var(--line3);background:var(--th);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.statusbar .s{display:flex;align-items:center;gap:6px}
.statusbar .neg{color:var(--muted2)}
.statusbar .ok{color:var(--blue);display:inline-flex;align-items:center;gap:6px}
.statusbar .ok .d{width:7px;height:7px;border-radius:50%;background:var(--blue)}

.preview{flex:1;overflow:auto;padding:22px 24px;background:#fff;color:var(--ink);font-size:15px;line-height:1.75}
.preview>:first-child{margin-top:0}
.preview h1,.preview h2,.preview h3{color:var(--title);line-height:1.35;margin:1.2em 0 .5em;font-weight:700}
.preview h1{font-size:1.5rem;border-bottom:2px solid var(--blue);padding-bottom:.25em;display:inline-block}
.preview h2{font-size:1.2rem;position:relative;padding-left:13px}
.preview h2::before{content:"";position:absolute;left:0;top:.16em;bottom:.16em;width:4px;border-radius:2px;background:var(--blue)}
.preview h3{font-size:1.04rem;color:#3a4a66}
.preview p{margin:.6em 0}
.preview a{color:var(--blue);text-decoration:none}
.preview a:hover{text-decoration:underline}
.preview code{font-family:var(--mono);background:var(--code-bg);padding:.12em .4em;border-radius:5px;font-size:.88em;color:#b3402f}
.preview pre{background:var(--code-bg);color:var(--code-ink);padding:14px 16px;border-radius:10px;overflow:auto;
  font-family:var(--mono);font-size:13px;line-height:1.6;border:1px solid var(--line3);border-left:3px solid #c2ccda;margin:.8em 0}
.preview pre code{background:none;color:inherit;padding:0}
.preview blockquote{margin:.8em 0;padding:.5em 1em;border-left:4px solid var(--blue);background:var(--blue-bg);border-radius:0 8px 8px 0;color:#3d5170}
.preview ul,.preview ol{padding-left:1.5em}
.preview li{margin:.25em 0}
.preview hr{border:0;border-top:1px dashed var(--line);margin:1.4em 0}
.preview table{border-collapse:collapse;margin:.8em 0;font-size:14px;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.preview th,.preview td{border:1px solid var(--line2);padding:8px 12px;text-align:center}
.preview th{background:var(--th);font-weight:700;color:var(--title)}
.preview tr:hover td{background:var(--rowh)}
.preview td a,.preview td code.url{font-family:var(--mono);font-size:12px;color:var(--blue)}
.preview img{max-width:100%;border-radius:8px}
.preview .katex-display{margin:.9em 0;padding:12px 10px;overflow-x:auto;overflow-y:hidden;background:var(--th);
  border:1px solid var(--line3);border-radius:10px;transition:border-color .15s,background .15s}
.preview .katex-display:hover{border-color:var(--blue);background:var(--blue-bg)}
.preview .math-err{color:var(--red);background:#fdecec;border:1px dashed #f3b3b3;padding:1px 6px;border-radius:5px;font-family:var(--mono);font-size:.85em}
.preview ruby{ruby-align:center}
.preview rt{font-size:.62em;color:var(--blue-d)}
.tzg{display:inline-grid;place-items:center;width:2.1em;height:2.1em;margin:0 3px;vertical-align:middle;
  border:2px solid #d9534f;position:relative;font-size:1.15em;color:var(--title);background:#fff;
  background-image:linear-gradient(#f1c9c5 0 0),linear-gradient(#f1c9c5 0 0);
  background-position:center,center;background-size:100% 1px,1px 100%;background-repeat:no-repeat}
.tzg.ghost{color:#f1c9c5}
.sxg{display:inline-block;position:relative;height:3em;line-height:3em;padding:0 .15em;margin:0 2px;vertical-align:middle;
  background:linear-gradient(#9aa6b8 0 0) top/100% 1px no-repeat,linear-gradient(var(--dash) 0 0) 33.33%/100% 1px no-repeat,
  linear-gradient(var(--dash) 0 0) 66.66%/100% 1px no-repeat,linear-gradient(#9aa6b8 0 0) bottom/100% 1px no-repeat}
.preview pre.vcalc{display:inline-block;background:var(--th);color:var(--code-ink);border:1px solid var(--line2);border-left:3px solid var(--blue);font-weight:600}

.pop{position:fixed;z-index:60;background:#fff;border:1px solid var(--line2);border-radius:10px;padding:10px;
  box-shadow:0 12px 36px rgba(0,0,0,.14);max-width:340px;animation:popin .14s ease}
@keyframes popin{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
.pop .ptitle{font-size:12px;color:var(--muted);margin:0 2px 8px}
.pop .grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.pop .grid.w6{grid-template-columns:repeat(6,1fr)}
.pop .sbtn{font-family:var(--mono);font-size:14px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);
  border-radius:6px;padding:6px 0;text-align:center;transition:all .12s}
.pop .sbtn:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-bg);transform:scale(1.06)}
.pop .sbtn:active{background:var(--blue);color:#fff;border-color:var(--blue)}

.modal-bg{position:fixed;inset:0;z-index:100;background:rgba(20,30,48,.4);backdrop-filter:blur(2px);
  display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .18s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:var(--r);width:min(560px,94vw);max-height:88vh;overflow:auto;
  box-shadow:0 24px 70px rgba(0,0,0,.25);animation:popin .2s ease}
.modal header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line3);position:sticky;top:0;background:#fff;z-index:1}
.modal header h3{margin:0;font-size:18px;color:var(--title);font-weight:700}
.modal header .x{cursor:pointer;color:var(--muted2);font-size:20px;line-height:1;border:0;background:none;padding:0 4px}
.modal header .x:hover{color:var(--red)}
.modal .body{padding:18px 20px}
.modal .row{display:flex;gap:12px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.modal label{font-size:13px;color:var(--muted);min-width:64px}
.modal input[type=number],.modal input[type=text],.modal textarea,.modal select{
  font-family:var(--mono);font-size:13px;background:#fff;border:1px solid var(--line);color:var(--ink);
  border-radius:8px;padding:8px 10px;outline:0;transition:border-color .15s,box-shadow .15s}
.modal input:focus,.modal textarea:focus,.modal select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,123,255,.12)}
.modal textarea{width:100%;min-height:64px;resize:vertical}
.modal input[type=number]{width:74px}
.modal .hint{font-size:12px;color:var(--muted2);margin:-4px 0 12px}
.modal .preview-box{background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:14px;margin-top:6px;min-height:40px;line-height:1.7}
.modal footer{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line3);position:sticky;bottom:0;background:#fff}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font-family:var(--sans);font-size:13px;background:#fff;color:var(--muted);border:0;border-right:1px solid var(--line2);padding:6px 12px;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--blue);color:#fff;font-weight:700}

.cheat{columns:2;column-gap:24px}
.cheat h4{color:var(--blue);margin:0 0 6px;font-size:15px;break-after:avoid;font-weight:700}
.cheat .item{break-inside:avoid;margin-bottom:10px;font-size:13px;color:var(--muted)}
.cheat code{font-family:var(--mono);background:var(--code-bg);color:#b3402f;padding:1px 6px;border-radius:5px;font-size:12px}
@media(max-width:760px){.cheat{columns:1}}

.toasts{position:fixed;right:18px;top:18px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:flex-end;max-width:320px}
.toast{background:rgba(20,24,30,.92);color:#fff;padding:10px 14px;border-radius:8px;font-size:13px;line-height:1.4;
  box-shadow:0 8px 24px rgba(0,0,0,.25);animation:toastin .25s ease}
@keyframes toastin{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}

#boot{position:fixed;inset:0;z-index:300;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
#boot .spin{width:34px;height:34px;border:3px solid #d3dbe6;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#boot .t{font-size:18px;color:var(--title);font-weight:700}
#boot .sub{color:var(--muted);font-size:13px;max-width:420px}
#boot.hidden{display:none}

@media(max-width:760px){
  .cols{flex-direction:column}
  .col.prev{border-left:0;border-top:1px solid var(--line2)}
  .splitter{display:none}
  .col.src,.col.prev{flex:1 1 auto;min-height:300px}
  .page-head{flex-direction:column}
}
</style>
</head>
<body>

<div id="boot">
  <div class="spin"></div>
  <div class="t">正在装配排版引擎…</div>
  <div class="sub" id="boot-sub">加载 Markdown / KaTeX / 化学式组件</div>
  <button class="btn primary" id="boot-retry" style="display:none">↻ 重新加载</button>
</div>

<div class="wrap">
  <div class="page-head">
    <div class="t">
      <h1><span class="emo">📝</span>安安小工具系列 | 混合文本编辑器</h1>
      <p>Markdown + LaTeX · 数学 / 化学 / 语文 / 排版 一站式撰写
        <span class="pill" title="纯本地：左写右画实时联动，内容不上传"><span class="dot"></span>实时渲染</span>
      </p>
    </div>
    <div class="head-actions">
      <button class="btn" id="btn-import" title="从本机读取 .md / .txt 文件，不上传"><span class="ic">📥</span>导入</button>
      <button class="btn" id="btn-template" title="套用内部题型骨架"><span class="ic">🗂</span>范式模板</button>
      <button class="btn" id="btn-cheat" title="语法速查手册"><span class="ic">❔</span>语法速查</button>
      <button class="btn on" id="btn-nosave" title="无痕模式：不向本机写入，关闭页面即清空"><span class="ic">🛡</span>无痕</button>
      <button class="btn" id="btn-copyhtml" title="复制渲染后的 HTML"><span class="ic">⧉</span>复制 HTML</button>
      <button class="btn" id="btn-download" title="下载为本机 .md 文件"><span class="ic">⤓</span>下载 .md</button>
      <button class="btn primary" id="btn-copy" title="复制标准范式源码"><span class="ic">⎘</span>复制源码</button>
      <button class="btn" id="btn-undo" title="撤销 (Ctrl+Z)"><span class="ic">↩</span>撤销</button>
      <button class="btn" id="btn-redo" title="重做 (Ctrl+Y)"><span class="ic">↪</span>重做</button>
      <button class="btn" id="btn-clear" title="清空当前编辑器内容"><span class="ic">🗑</span>一键清空</button>
      <button class="btn" id="btn-shortcuts" title="快捷键帮助"><span class="ic">⌨</span>快捷键</button>
      <button class="btn" id="btn-history" title="操作历史"><span class="ic">📜</span>历史</button>
      <button class="btn" id="btn-darkmode" title="切换暗色/亮色模式"><span class="ic">🌙</span>暗色</button>
    </div>
  </div>

  <div class="card">
    <div class="toolbar" id="toolbar"></div>
  </div>

  <div class="card editor-card">
    <div class="cols">
      <section class="col src" id="panel-src">
        <div class="phead"><span>Markdown 源码</span><span class="meta" id="m-src">Ln 1, Col 1</span></div>
        <div class="editor-wrap" id="editor-wrap">
          <div class="gutter" id="gutter"></div>

/* 1. 自写 KaTeX 插件 */
function katexPlugin(md){
  function inline(state,silent){
    if(state.src.charCodeAt(state.pos)!==0x24)return false;
    const start=state.pos+1,max=state.posMax;
    if(start>=max)return false;
    const c0=state.src.charCodeAt(start);
    if(c0===0x20||c0===0x09||c0===0x24)return false;
    let end=start;
    while(end<max){
      if(state.src.charCodeAt(end)===0x24&&state.src.charCodeAt(end-1)!==0x5C&&state.src.charCodeAt(end-1)!==0x20)break;
      end++;
    }
    if(end>=max)return false;
    if(!silent){const t=state.push("math_inline","math",0);t.markup="$";t.content=state.src.slice(start,end);}
    state.pos=end+1;return true;
  }
  md.inline.ruler.after("escape","math_inline",inline);
  md.renderer.rules.math_inline=(tok,i)=>renderTex(tok[i].content,false);

  function block(state,startLine,endLine,silent){
    let pos=state.bMarks[startLine]+state.tShift[startLine],max=state.eMarks[startLine];
    if(state.src.charCodeAt(pos)!==0x24||state.src.charCodeAt(pos+1)!==0x24)return false;
    pos+=2;
    let first=state.src.slice(pos,max),found=false,lastLine="",lastPos=0,next=startLine;
    if(first.trim().slice(-2)==="$$"){first=first.trim().slice(0,-2);found=true;}
    for(;!found;){
      next++;if(next>=endLine)break;
      pos=state.bMarks[next]+state.tShift[next];max=state.eMarks[next];
      if(pos<max&&state.tShift[next]<state.blkIndent)break;
      if(state.src.slice(pos,max).trim().slice(-2)==="$$"){lastPos=state.src.slice(0,max).lastIndexOf("$$");lastLine=state.src.slice(pos,lastPos);found=true;}
    }
    if(!found)return false;
    if(silent)return true;
    const t=state.push("math_block","math",0);t.block=true;t.markup="$$";
    t.content=(first&&first.trim()?first+"\n":"")+state.getLines(startLine+1,next,state.tShift[startLine],true)+(lastLine&&lastLine.trim()?lastLine:"");
    t.map=[startLine,state.line=next+1];
    return true;
  }
  md.block.ruler.before("fence","math_block",block,{alt:["paragraph","reference","blockquote","list"]});
  md.renderer.rules.math_block=(tok,i)=>renderTex(tok[i].content,true);

  function renderTex(tex,display){
    // 预处理：KaTeX 不原生支持 \enclose{longdiv}{}，转为近似渲染
    tex=tex.replace(/\\enclose\{longdiv\}\{([^}]*)\}/g,'\\overline{\\smash{\\big)}\\,$1}');
    try{return katex.renderToString(tex,{displayMode:display,throwOnError:false,output:"html"});}
    catch(e){return '<span class="math-err" title="'+escAttr(e.message)+'">'+esc(tex)+'</span>';}
  }
}

/* 2. 引擎初始化 */
let md=null;
function boot(){
  const sub=$("#boot-sub"),retry=$("#boot-retry");
  if(typeof window.markdownit==="undefined"||typeof window.katex==="undefined"){
    sub.textContent="组件加载失败：请检查网络后点击下方重试（cdnjs 偶发抽风属正常）。";
    retry.style.display="inline-flex";return;
  }
  try{
    md=window.markdownit({html:true,linkify:true,typographer:true,breaks:false});
    md.use(katexPlugin);
    $("#boot").classList.add("hidden");
    afterBoot();
  }catch(e){
    sub.textContent="引擎初始化异常："+e.message;retry.style.display="inline-flex";
  }
}
$("#boot-retry").addEventListener("click",()=>location.reload());
window.addEventListener("load",boot);

/* ★ 样式表自检：css 没生效就报警，不再靠肉眼发现根号散架 */
function checkKatexCss(){
  const s=document.createElement("span");
  s.className="katex";
  s.style.cssText="position:absolute;left:-9999px;top:-9999px;visibility:hidden;pointer-events:none";
  s.textContent="x";
  document.body.appendChild(s);
  const ff=(getComputedStyle(s).fontFamily||"");
  s.remove();
  const ok=/KaTeX/i.test(ff);
  if(!ok){
    toast("⚠ KaTeX 样式表未加载，公式排版会错乱，请检查网络后刷新页面");
    const e=$("#st-engine");
    if(e){e.classList.remove("ok");e.style.color="#cc0000";e.title="katex.min.css 未生效";e.innerHTML='⚠ 公式样式缺失';}
  }
  return ok;
}

// 智能插入化学式：自动检测是否在公式块内，不在则自动加 $...$ 包裹
// ★ 通用：检测光标是否在公式块（$..$ 或 $..$）内
function isInMathBlock(){
  const pos=src.selectionStart;
  const text=src.value;
  // 先检查 $ 块级公式
  let lastDoubleDollar=-1;
  for(let i=0;i<pos;i++){
    if(text[i]==="$"&&text[i+1]==="$"){lastDoubleDollar=i;i++;}
  }
  if(lastDoubleDollar>=0){
    let closeIdx=text.indexOf("$",lastDoubleDollar+2);
    if(closeIdx<0||closeIdx>=pos)return true;
  }
  // 再检查 $ 行内公式
  let lastDollar=-1;
  for(let i=0;i<pos;i++){
    if(text[i]==="$"&&(text[i+1]!=="$"))lastDollar=i;
  }
  if(lastDollar>=0){
    for(let i=lastDollar+1;i<pos;i++){
      if(text[i]==="$"&&(text[i+1]!=="$")){lastDollar=-1;break;}
    }
    if(lastDollar>=0)return true;
  }
  return false;
}
// ★ 智能插入：自动判断是否在公式块内，不在就加 $...$ 包裹
function smartInsertMath(latex){
  if(isInMathBlock()){
    insertAtCursor(latex);
  }else{
    insertAtCursor("$"+latex+"$");
  }
}
function insertChemFormula(latex){
  smartInsertMath(latex);
}

}

/* 5. 编辑核心 */
const src=$("#source"),prev=$("#preview"),gutter=$("#gutter"),wrap=$("#editor-wrap");

// 撤销/重做栈
let undoStack=[];
let redoStack=[];
let lastValue="";

function pushUndo(){
  // 把当前内容推入撤销栈（修改前调用）
  undoStack.push(src.value);
  if(undoStack.length>100)undoStack.shift();
  redoStack=[];
}

function undo(){
  if(undoStack.length>0){
    redoStack.push(src.value);
    src.value=undoStack.pop();
    render();
    toast("↩ 已撤销");
  }else{
    toast("没有可撤销的操作");
  }
}

function redo(){
  if(redoStack.length>0){
    undoStack.push(src.value);
    src.value=redoStack.pop();
    render();
    toast("↪ 已重做");
  }else{
    toast("没有可重做的操作");
  }
}

// 撤销/重做按钮
$("#btn-undo").addEventListener("click",undo);
$("#btn-redo").addEventListener("click",redo);

function insertAtCursor(text){
  pushUndo(); // ★ 修改前保存状态
  const s=src.selectionStart,e=src.selectionEnd,v=src.value;
  src.value=v.slice(0,s)+text+v.slice(e);
  const np=s+text.length;src.selectionStart=src.selectionEnd=np;src.focus();
  lastValue=src.value;
  render();
  const ph=text.indexOf("□");if(ph>=0){src.selectionStart=s+ph;src.selectionEnd=s+ph+1;}
  recordOperation("插入文本");
}

// 包裹选中文本
function wrapSelection(before,after,placeholder){
  pushUndo(); // ★ 修改前保存状态
  const s=src.selectionStart,e=src.selectionEnd,v=src.value;
  const selected=v.slice(s,e);
  if(selected){
    const wrapped=before+selected+after;
    src.value=v.slice(0,s)+wrapped+v.slice(e);
    src.selectionStart=s;src.selectionEnd=s+wrapped.length;
  }else{
    const text=before+placeholder+after;
    src.value=v.slice(0,s)+text+v.slice(e);
    src.selectionStart=s+before.length;src.selectionEnd=s+before.length+placeholder.length;
  }
  lastValue=src.value;
  src.focus();render();
  recordOperation("格式："+before+"..."+after);
}
let rt=null;
function render(){
  clearTimeout(rt);
  rt=setTimeout(()=>{
    const t0=performance.now();
    try{prev.innerHTML=md.render(src.value);}catch(e){prev.innerHTML='<p class="math-err">渲染异常：'+esc(e.message)+'</p>';}
    $("#m-render").textContent=Math.round(performance.now()-t0)+" ms";
    updateGutter();updateCount();updateCursor();autoSave();
  },120);
}
function updateGutter(){
  const n=src.value.split("\n").length;
  if(gutter.childElementCount!==n){let h="";for(let i=1;i<=n;i++)h+="<div>"+i+"</div>";gutter.innerHTML=h;}
  gutter.scrollTop=src.scrollTop;
}
function updateCount(){const v=src.value;$("#st-count").textContent=v.length+" 字符 · "+v.split("\n").length+" 行";}
function updateCursor(){
  const pos=src.selectionStart,before=src.value.slice(0,pos);
  const ln=before.split("\n").length,col=pos-before.lastIndexOf("\n");
  $("#m-src").textContent="Ln "+ln+", Col "+col;
}
src.addEventListener("beforeinput",()=>{pushUndo();});
src.addEventListener("input",()=>{lastValue=src.value;render();});
src.addEventListener("keyup",updateCursor);
src.addEventListener("click",updateCursor);
src.addEventListener("scroll",()=>{gutter.scrollTop=src.scrollTop;syncScroll("src");});
src.addEventListener("keydown",e=>{
  // 智能 Tab 缩进
  if(e.key==="Tab"){
    e.preventDefault();
    insertAtCursor("  ");
    return;
  }
  // 智能括号补全：检测是否有未匹配的同类符号
  if(!e.ctrlKey&&!e.metaKey){
    const pairs={"(":")","[":"]","{":"}"};
    const selfPairs={"$":"$","*":"*","`":"`"};
    const s=src.selectionStart,end=src.selectionEnd;
    const text=src.value;
    const selected=text.slice(s,end);
    
    // 处理有选中文本的情况：任何配对符号都包裹选中文本
    if(selected&&(pairs[e.key]||selfPairs[e.key])){
      e.preventDefault();
      const close=pairs[e.key]||selfPairs[e.key];
      src.value=text.slice(0,s)+e.key+selected+close+text.slice(end);
      src.selectionStart=s+1;
      src.selectionEnd=s+1+selected.length;
      render();
      return;
    }
    
    // 处理 ( [ { 类：始终补全右括号
    if(!selected&&pairs[e.key]){
      e.preventDefault();
      src.value=text.slice(0,s)+e.key+pairs[e.key]+text.slice(end);
      src.selectionStart=src.selectionEnd=s+1;
      render();
      return;
    }
    
    // 处理 $ * ` 自配对符号：智能判断
    if(!selected&&selfPairs[e.key]){
      const ch=e.key;
      // 如果光标右边紧邻同类字符，直接跳过（不新增）
      if(text[s]===ch){
        e.preventDefault();
        src.selectionStart=src.selectionEnd=s+1;
        return;
      }
      // 统计前面和后面的同类字符数
      let countBefore=0,countAfter=0;
      for(let i=0;i<s;i++){if(text[i]===ch)countBefore++;}
      for(let i=s;i<text.length;i++){if(text[i]===ch)countAfter++;}
      // 判断逻辑：
      // - 前面奇数（有孤立的等着闭合）→ 只插入一个，闭合前面的
      // - 后面奇数（后面有孤立的等着配对）→ 只插入一个，配对后面的
      // - 前后都是偶数（全部已配对）→ 新开一对，插入两个
      if(countBefore%2===1||countAfter%2===1){
        // 有孤立的，只插入一个字符去配对，不多补
        return; // 放行默认输入行为
      }else{
        // 全部已配对，新开一对
        e.preventDefault();
        src.value=text.slice(0,s)+ch+ch+text.slice(end);
        src.selectionStart=src.selectionEnd=s+1;
        render();
        return;
      }
    }
    
    // 处理右括号跳过：如果输入的是 ) ] } 且光标右侧就是对应字符，跳过
    const closeChars={")":").","]":"].","}":"}."};
    if(!selected&&(e.key===")"||e.key==="]"||e.key==="}")){
      if(text[s]===e.key){
        e.preventDefault();
        src.selectionStart=src.selectionEnd=s+1;
        return;
      }
    }
  }
  // 快捷键
  if(e.ctrlKey||e.metaKey){
    if(e.key==="z"){e.preventDefault();undo();}
    else if(e.key==="y"){e.preventDefault();redo();}
    else if(e.key==="b"){e.preventDefault();wrapSelection("**","**","文本");}
    else if(e.key==="i"){e.preventDefault();wrapSelection("*","*","文本");}
    else if(e.key==="u"){e.preventDefault();wrapSelection("<u>","</u>","文本");}
    else if(e.key==="s"){e.preventDefault();wrapSelection("~~","~~","文本");}
    else if(e.key==="k"){e.preventDefault();wrapSelection("[","](https://)","链接文本");}
    else if(e.key==="`"){e.preventDefault();wrapSelection("`","`","代码");}
    else if(e.key==="f"){e.preventDefault();showSearchDialog();}
  }
});

// 搜索替换对话框
function showSearchDialog(){
  const existing=document.getElementById("search-dialog");
  if(existing){existing.remove();return;}
  const dialog=document.createElement("div");
  dialog.id="search-dialog";
  dialog.style.cssText="position:fixed;top:60px;right:20px;background:var(--card);padding:16px;border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,0.3);z-index:10000;min-width:340px;border:1px solid var(--line);";
  dialog.innerHTML='<div style="display:flex;gap:8px;margin-bottom:8px;"><input type="text" id="search-input" placeholder="搜索内容" style="flex:1;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--code-bg);color:var(--ink);font-size:13px;outline:none;"><span id="search-count" style="font-size:12px;color:var(--muted);white-space:nowrap;line-height:32px;">0/0</span></div><div style="display:flex;gap:8px;margin-bottom:10px;"><input type="text" id="replace-input" placeholder="替换为（可选）" style="flex:1;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--code-bg);color:var(--ink);font-size:13px;outline:none;"></div><div style="display:flex;gap:6px;flex-wrap:wrap;"><button class="btn" id="search-prev">↑ 上一个</button><button class="btn" id="search-next">↓ 下一个</button><button class="btn" id="replace-one">替换</button><button class="btn" id="replace-all">全部替换</button><button class="btn" id="search-close">✕ 关闭</button></div>';
  document.body.appendChild(dialog);
  
  const searchInput=document.getElementById("search-input");
  const replaceInput=document.getElementById("replace-input");
  const countEl=document.getElementById("search-count");
  let matches=[];
  let currentIdx=0;
  
  function findAll(){
    const q=searchInput.value;
    matches=[];
    if(!q){countEl.textContent="0/0";return;}
    let idx=0;
    while((idx=src.value.indexOf(q,idx))!==-1){matches.push(idx);idx+=q.length;}
    currentIdx=0;
    countEl.textContent=matches.length>0?(currentIdx+1)+"/"+matches.length:"0/0";
    if(matches.length>0)highlight();
  }
  
  function highlight(){
    if(matches.length===0)return;
    const pos=matches[currentIdx];
    src.focus();
    src.setSelectionRange(pos,pos+searchInput.value.length);
    countEl.textContent=(currentIdx+1)+"/"+matches.length;
  }
  
  searchInput.addEventListener("input",findAll);
  document.getElementById("search-next").addEventListener("click",()=>{
    if(matches.length>0){currentIdx=(currentIdx+1)%matches.length;highlight();}
  });
  document.getElementById("search-prev").addEventListener("click",()=>{
    if(matches.length>0){currentIdx=(currentIdx-1+matches.length)%matches.length;highlight();}
  });
  document.getElementById("replace-one").addEventListener("click",()=>{
    const q=searchInput.value,r=replaceInput.value;
    if(!q||matches.length===0)return;
    const pos=matches[currentIdx];
    pushUndo();
    src.value=src.value.slice(0,pos)+r+src.value.slice(pos+q.length);
    lastValue=src.value;
    render();findAll();
    toast("已替换 1 处");
  });
  document.getElementById("replace-all").addEventListener("click",()=>{
    const q=searchInput.value,r=replaceInput.value;
    if(!q)return;
    pushUndo();
    const count=matches.length;
    src.value=src.value.split(q).join(r);
    lastValue=src.value;
    render();findAll();
    toast("已替换 "+count+" 处");
  });
  document.getElementById("search-close").addEventListener("click",()=>dialog.remove());
  searchInput.focus();
}

function buildVcalcLatex(op,a,b){
  a=String(a).trim();b=String(b).trim();
  if(!/^\d+$/.test(a)||!/^\d+$/.test(b))return "\\text{（请输入非负整数）}";
  if(op==="÷")return buildDivLatex(a,b);
  const opSym=op==="+"?"+":(op==="-"?"-":"\\times");
  if(op==="+"||op==="-"){
    const res=op==="+"?String(BigInt(a)+BigInt(b)):String(BigInt(a)-BigInt(b));
    return buildAlignedCalc([a,b],[opSym],res);
  }
  // 乘法
  const product=String(BigInt(a)*BigInt(b));
  const bDigits=b.split("").reverse();
  const partials=[];
  bDigits.forEach((d,i)=>{partials.push({val:String(BigInt(a)*BigInt(d)),shift:i});});
  return buildMulCalc(a,b,partials,product);
}
// 加减法：每位一列对齐
function buildAlignedCalc(nums,ops,result){
  const maxLen=Math.max(...nums.map(n=>n.length),result.length);
  const cols=maxLen+1;
  const colSpec=Array(cols).fill("c").join("");
  function digitRow(num,prefix){
    const padded=num.padStart(maxLen);
    const cells=[(prefix||" ")];
    for(let i=0;i<maxLen;i++) cells.push(padded[i]===" "?" ":padded[i]);
    return cells.join(" & ");
  }
  const lines=[];
  lines.push(digitRow(nums[0]," "));
  for(let i=1;i<nums.length;i++) lines.push(digitRow(nums[i],ops[i-1]||" "));
  lines.push("\\hline");
  lines.push(digitRow(result," "));
  return "\\begin{array}{"+colSpec+"}\n"+lines.join(" \\\\\n")+"\n\\end{array}";
}
// 乘法：逐位对齐
function buildMulCalc(a,b,partials,product){
  const maxLen=Math.max(a.length,b.length,product.length,...partials.map(p=>p.val.length+p.shift));
  const cols=maxLen+1;
  const colSpec=Array(cols).fill("c").join("");
  function digitRow(num,prefix,rightShift){
    rightShift=rightShift||0;
    const total=num.length+rightShift;
    const leftPad=maxLen-total;
    const cells=[(prefix||" ")];
    for(let i=0;i<leftPad;i++) cells.push(" ");
    for(let i=0;i<num.length;i++) cells.push(num[i]);
    for(let i=0;i<rightShift;i++) cells.push(" ");
    return cells.join(" & ");
  }
  const lines=[];
  lines.push(digitRow(a," ",0));
  lines.push(digitRow(b,"\\times",0));
  lines.push("\\hline");
  if(partials.length===1||(partials.filter(p=>p.val!=="0").length<=1)){
    const p=partials.find(x=>x.val!=="0")||partials[0];
    lines.push(digitRow(p.val," ",p.shift));
  }else{
    partials.forEach(p=>{lines.push(digitRow(p.val," ",p.shift));});
    lines.push("\\hline");
  }
  lines.push(digitRow(product," ",0));
  return "\\begin{array}{"+colSpec+"}\n"+lines.join(" \\\\\n")+"\n\\end{array}";
}
// 除法
// 除法竖式：模拟手算（千问 max 方案，phantom 对齐 + drawable 过滤）
function simulateDiv(dividend,divisor){
  const digits=String(dividend).split("").map(Number);
  const n=digits.length,qDigits=[],steps=[];
  let cur=0,started=false;
  for(let i=0;i<n;i++){
    cur=cur*10+digits[i];
    const q=Math.floor(cur/divisor);
    if(!started&&q===0&&i<n-1)continue; // 跳过商的前导零
    started=true;
    qDigits.push(q);
    steps.push({end:i,q:q,product:q*divisor,partial:cur});
    cur-=q*divisor;
  }
  return {digits,qDigits,steps,rem:cur};
}
function buildDivLatex(dividend,divisor){
  const dNum=Number(dividend),bNum=Number(divisor);
  if(bNum===0)return "\\text{（除数不能为 0）}";
  if(dNum<bNum)return "\\text{（被除数应 ≥ 除数）}";
  const {digits,qDigits,steps,rem}=simulateDiv(dNum,bNum);
  // drawable：商中间为0的步骤按教材惯例不写减法行（如 906÷3）
  const drawable=steps.map((s,k)=>s.q>0||k===steps.length-1);
  // 行尾补 phantom，使该行右端对齐到被除数第 i 位
  const pad=i=>{const r=digits.slice(i+1).join("");return r?"\\phantom{"+r+"}":"";};
  const body=[];
  let prevEnd=-1,prevRem=null;
  for(let k=0;k<steps.length;k++){
    const s=steps[k];
    if(!drawable[k]){prevEnd=s.end;prevRem=s.partial;continue;}
    // "落下来"一行 = 上步余数拼落下的数字
    if(prevRem!==null){
      body.push(prevRem+""+digits.slice(prevEnd+1,s.end+1).join("")+pad(s.end));
    }
    body.push("\\underline{"+s.product+"}"+pad(s.end));
    prevEnd=s.end;
    prevRem=s.partial-s.product;
  }
  // 最终余数
  body.push(String(rem));
  const rows=[
    qDigits.join(""),
    divisor+"\\enclose{longdiv}{"+digits.join("")+"}",
    ...body
  ];
  return "\\begin{array}{r}\n"+rows.join(" \\\\[2pt]\n")+"\n\\end{array}";
}
function buildVcalc(op,a,b){return buildVcalcLatex(op,a,b);}
function vadd(a,b,res,op){const W=Math.max(a.length,b.length,res.length);return [" "+padL(a,W),op+padL(b,W),"-".repeat(W+1)," "+padL(res,W)].join("\n");}
function vmul(a,b){
  const product=String(BigInt(a)*BigInt(b));
  const digits=b.split("").reverse();
  const parts=[];
  digits.forEach((d,i)=>{
    const p=String(BigInt(a)*BigInt(d));
    parts.push({p:p,shift:i});
  });
  // W = 总宽度，等于最终结果的位数
  const W=product.length;
  const line="-".repeat(W+1);
  const out=[" "+padL(a,W),"×"+padL(b,W),line];
  if(digits.filter(d=>d!=="0").length<=1){
    // 只有一个非零部分积
    const o=parts.find(x=>x.p!=="0")||parts[0];
    out.push(" "+padL(o.p,W-o.shift)+(" ".repeat(o.shift)));
  }else{
    // 多个部分积，每个右侧补空格实现错位（不补零）
    parts.forEach(o=>{
      out.push(" "+padL(o.p,W-o.shift)+(" ".repeat(o.shift)));
    });
    out.push(line);
  }
  out.push(" "+padL(product,W));
  return out.join("\n");
}

        operationHistory=[];
        toast("历史已清空");
        bg.remove();
      }
    });
  });
}

// ★ 括号匹配高亮（像IDE那样高亮对应括号）
function initBracketMatch(){

  src.addEventListener("keyup",checkBracketMatch);
  src.addEventListener("click",checkBracketMatch);
}

function checkBracketMatch(){
  const pos=src.selectionStart;
  const text=src.value;
  const openBrackets={"(":")","[":"]","{":"}"};
  const closeBrackets={")":"(","]":"[","}":"{"};
  const charBefore=text[pos-1];
  const charAfter=text[pos];
  let matchPos=-1;
  
  if(charAfter&&openBrackets[charAfter]){
    matchPos=findMatchingBracket(text,pos,charAfter,openBrackets[charAfter],1);
  }else if(charBefore&&closeBrackets[charBefore]){
    matchPos=findMatchingBracket(text,pos-1,charBefore,closeBrackets[charBefore],-1);
  }else if(charBefore&&openBrackets[charBefore]){
    matchPos=findMatchingBracket(text,pos-1,charBefore,openBrackets[charBefore],1);
  }
  
  const matchInfo=$("#bracket-match");
  if(matchInfo){
    if(matchPos>=0){
      const matchLine=text.slice(0,matchPos).split("\n").length;
      matchInfo.textContent="✓ 匹配括号在第 "+matchLine+" 行";
      matchInfo.style.color="var(--blue)";
    }else{
      matchInfo.textContent="";
    }
  }
  

}

function findMatchingBracket(text,startPos,open,close,direction){
  let depth=0;
  let pos=startPos;
  while(pos>=0&&pos<text.length){
    if(text[pos]===open&&text[pos-1]!=="\\")depth+=direction;
    else if(text[pos]===close&&text[pos-1]!=="\\"){depth-=direction;if(depth===0)return pos;}
    pos+=direction;
  }
  return -1;
}

// ★ 暗色模式
function initDarkMode(){
  // 读取用户偏好
  const saved=localStorage.getItem("anan-editor-dark");
  if(saved==="1")document.documentElement.classList.add("dark");
  updateDarkBtn();
  
  $("#btn-darkmode").addEventListener("click",()=>{
    document.documentElement.classList.toggle("dark");
    const isDark=document.documentElement.classList.contains("dark");
    localStorage.setItem("anan-editor-dark",isDark?"1":"0");
    updateDarkBtn();
    toast(isDark?"🌙 已切换到暗色模式":"☀️ 已切换到亮色模式");
  });
}

function updateDarkBtn(){
  const isDark=document.documentElement.classList.contains("dark");
  const btn=$("#btn-darkmode");
  if(btn){
    btn.innerHTML='<span class="ic">'+(isDark?"☀️":"🌙")+'</span>'+(isDark?"亮色":"暗色");
    btn.classList.toggle("on",isDark);
  }
}
